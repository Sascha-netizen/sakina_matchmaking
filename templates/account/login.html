{% extends 'base.html' %}

{% block title %}Sign In — Sakina{% endblock %}

{% block content %}
<h1>Sign In</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign In</button>
</form>
<p>Don't have an account? <a href="{% url 'account_signup' %}">Sign Up</a></p>
{% endblock %}
