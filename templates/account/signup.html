{% extends 'base.html' %}

{% block title %}Sign Up — Sakina{% endblock %}

{% block content %}
<h1>Sign Up</h1>
<p class="form-hint">Choose a username that represents you — for example <strong>sara_ahmed</strong> or <strong>yusuf_ali</strong>.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'account_login' %}">Sign In</a></p>
{% endblock %}
