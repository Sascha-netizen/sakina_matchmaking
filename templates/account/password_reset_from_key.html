{% extends 'base.html' %}

{% block title %}Set New Password — Sakina{% endblock %}

{% block content %}
<h1>Set New Password</h1>
{% if token_fail %}
    <p>This password reset link is invalid or has expired. Please <a href="{% url 'account_reset_password' %}">request a new one</a>.</p>
{% else %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Set New Password</button>
    </form>
{% endif %}
{% endblock %}
